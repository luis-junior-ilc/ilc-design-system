<fieldset [attr.aria-disabled]="disabled()" [attr.data-orientation]="orientation()"
  [attr.aria-labelledby]="ariaLabelledBy() || null" [attr.aria-describedby]="ariaDescribedBy() || null">
  @if (legend()) { <legend>{{ legend() }}</legend> }
  @for (option of options(); track option.value) {
    <label [for]="id() + '-' + option.value"><input [id]="id() + '-' + option.value" type="radio" [name]="name()"
      [value]="option.value" [checked]="value() === option.value" [disabled]="disabled() || !!option.disabled"
      (change)="select(option.value)" (blur)="markTouched()" /><span>{{ option.label }}</span></label>
  }
</fieldset>
