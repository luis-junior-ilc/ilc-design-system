<button [id]="id()" type="button" role="combobox" aria-haspopup="listbox" [attr.aria-expanded]="open()"
  [attr.aria-controls]="listId()" [attr.aria-label]="ariaLabel() || null" [attr.aria-labelledby]="ariaLabelledBy() || null"
  [attr.aria-describedby]="ariaDescribedBy() || null" [attr.aria-invalid]="ngControl?.invalid || null"
  [attr.aria-activedescendant]="open() && activeIndex() >= 0 ? listId() + '-option-' + activeIndex() : null"
  [disabled]="disabled()" (click)="toggle()" (keydown)="onKeydown($event)" (blur)="markTouched()">
  {{ displayValue() || placeholder() }}
</button>
@if (open()) {
  <div class="ds-select__backdrop" (click)="open.set(false)" aria-hidden="true"></div>
  <ul [id]="listId()" role="listbox" class="ds-select__listbox">
    @for (option of options(); track option.value; let index = $index) {
      <li [id]="listId() + '-option-' + index" role="option" [attr.aria-selected]="option.value === value()" [attr.aria-disabled]="option.disabled || null"
        [class.ds-select__option--active]="activeIndex() === index" (click)="choose(option)">
        {{ option.label }}
      </li>
    } @empty { <li class="ds-select__empty">No options</li> }
  </ul>
}
