<input
  [id]="id()" [type]="inputType()" [placeholder]="placeholder()" [autocomplete]="autocomplete()"
  [value]="value() ?? ''" [disabled]="disabled()" [attr.aria-label]="ariaLabel()"
  [attr.aria-labelledby]="ariaLabelledBy() || null" [attr.aria-describedby]="ariaDescribedBy() || null"
  [attr.aria-invalid]="ngControl?.invalid || null"
  (input)="onInput($event)" (focus)="focused.set(true)" (blur)="focused.set(false); markTouched()"
/>
<button type="button" [disabled]="disabled()" (click)="toggleVisibility()"
  [attr.aria-label]="isVisible() ? 'Hide password' : 'Show password'" [attr.aria-pressed]="isVisible()">
  {{ isVisible() ? 'Hide' : 'Show' }}
</button>
