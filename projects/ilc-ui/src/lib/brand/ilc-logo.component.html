<span class="ilc-logo" role="img" [attr.aria-label]="ariaLabel">
  <svg class="ilc-logo__emblem" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <clipPath id="ilc-globe-clip">
        <circle cx="50" cy="50" r="46" />
      </clipPath>
    </defs>
    <g clip-path="url(#ilc-globe-clip)">
      <rect x="0" y="0" width="100" height="100" fill="#6d6e71" />
      <polygon points="56,22 100,22 100,100 44,100" fill="#465357" />
      <circle cx="67" cy="25" r="22" fill="#ffe109" />
      <polygon points="16,22 65,22 50,100 2,100" fill="#07b1d6" />
      <path d="M44,22 H65 L61,44 A22,22 0 0 1 44,22 Z" fill="#00943e" />
      <path d="M10,100 A68,68 0 0 1 65,22 L50,100 Z" fill="#0093b5" opacity="0.45" />
    </g>
  </svg>

  @if (variant === 'full') {
    <span class="ilc-logo__wordmark" aria-hidden="true">
      <span class="ilc-logo__acronym">ILC</span>
      <span class="ilc-logo__tagline">INTEGRATOR</span>
      <span class="ilc-logo__subtagline">LOGISTICS COMPANY</span>
    </span>
  }
</span>
