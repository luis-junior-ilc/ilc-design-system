name: Publish design system

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@grupo-mirassol'

      - run: npm ci

      - run: npm run build -- --project ilc-ui

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./dist/ilc-ui/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PACKAGE_VERSION" = "$TAG_VERSION" || {
            echo "Tag v$TAG_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          }

      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: dist/ilc-ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
